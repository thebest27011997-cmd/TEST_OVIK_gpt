name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. SYSTEM PACKAGES
      # ============================================================

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            build-essential \
            cmake \
            ninja-build \
            gettext \
            autopoint \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            python3-dev \
            ccache


      # ============================================================
      # 5. BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<81" \
            wheel \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          echo "=============================="
          echo "VERSIONS"
          echo "=============================="

          python --version
          java -version
          buildozer --version
          cython --version


      # ============================================================
      # 6. FIX BUILDOZER SPEC
      # ============================================================

      - name: Prepare buildozer.spec
        run: |
          set -euxo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          if not path.exists():
              raise RuntimeError("buildozer.spec not found")

          text = path.read_text(encoding="utf-8")

          lines = []

          for line in text.splitlines():

              stripped = line.strip()

              # Remove old forced p4a branch.
              if stripped.startswith("p4a.branch"):
                  continue

              # Force one architecture for diagnostic build.
              if stripped.startswith("android.archs"):
                  lines.append("android.archs = arm64-v8a")
                  continue

              # Keep Android API fixed.
              if stripped.startswith("android.api"):
                  lines.append("android.api = 35")
                  continue

              if stripped.startswith("android.minapi"):
                  lines.append("android.minapi = 23")
                  continue

              lines.append(line)

          text = "\n".join(lines) + "\n"

          path.write_text(
              text,
              encoding="utf-8",
          )

          print("buildozer.spec prepared")
          PY

          echo "=============================="
          echo "ANDROID CONFIGURATION"
          echo "=============================="

          grep -E \
            "^(requirements|android.api|android.minapi|android.archs|p4a.branch)" \
            buildozer.spec || true


      # ============================================================
      # 7. CLEAN EVERYTHING
      # ============================================================

      - name: Clean old Android build
        run: |
          set -euxo pipefail

          echo "=============================="
          echo "FULL CLEAN"
          echo "=============================="

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Project build cache removed."


      # ============================================================
      # 8. VERIFY PROJECT
      # ============================================================

      - name: Verify project files
        run: |
          set -euxo pipefail

          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          test -f main.py
          test -f testov.kv
          test -f buildozer.spec
          test -d data

          echo
          echo "DAT FILES:"
          find data \
            -maxdepth 1 \
            -type f \
            -name "*.dat" \
            -print

          DAT_COUNT=$(
            find data \
              -maxdepth 1 \
              -type f \
              -name "*.dat" \
              | wc -l
          )

          echo
          echo "DAT count: $DAT_COUNT"

          if [ "$DAT_COUNT" -eq 0 ]; then
            echo "ERROR: no DAT files found"
            exit 1
          fi

          echo
          echo "buildozer.spec:"
          grep -E \
            "^(title|package.name|package.domain|requirements|android.api|android.minapi|android.archs)" \
            buildozer.spec || true


      # ============================================================
      # 9. BUILD
      # ============================================================

      - name: Build APK
        run: |
          set -o pipefail

          echo "=============================="
          echo "CLEAN APK BUILD"
          echo "=============================="

          buildozer -v android debug \
            2>&1 | tee build.log


      # ============================================================
      # 10. DEBUG INFORMATION
      # ============================================================

      - name: Show build diagnostics
        if: failure()
        run: |
          echo "=============================="
          echo "LAST 300 BUILD LOG LINES"
          echo "=============================="

          tail -300 build.log || true

          echo
          echo "=============================="
          echo "MISSING KIVY C FILE CHECK"
          echo "=============================="

          find .buildozer \
            -type f \
            \( \
              -name "_img_sdl2.c" \
              -o -name "_text_sdl2.c" \
              -o -name "audio_sdl2.c" \
              -o -name "_clipboard_sdl2.c" \
            \) \
            -print \
            2>/dev/null || true

          echo
          echo "=============================="
          echo "KIVY DIRECTORIES"
          echo "=============================="

          find .buildozer \
            -type d \
            -path "*kivy*core*" \
            -print \
            2>/dev/null \
            | head -100 || true


      # ============================================================
      # 11. UPLOAD LOG
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # 12. FIND APK
      # ============================================================

      - name: Find APK
        if: success()
        run: |
          set -euxo pipefail

          echo "=============================="
          echo "APK FILES"
          echo "=============================="

          find bin \
            -type f \
            -name "*.apk" \
            -ls

          APK_COUNT=$(
            find bin \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK not found"
            exit 1
          fi


      # ============================================================
      # 13. RENAME APK
      # ============================================================

      - name: Rename APK
        if: success()
        run: |
          set -euxo pipefail

          APK_FILE=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | head -n 1
          )

          test -n "$APK_FILE"

          NEW_APK="bin/TEST_OVIK_${{ github.run_number }}.apk"

          mv "$APK_FILE" "$NEW_APK"

          echo "APK:"
          ls -lh "$NEW_APK"


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TEST_OVIK_${{ github.run_number }}
          path: bin/TEST_OVIK_${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
