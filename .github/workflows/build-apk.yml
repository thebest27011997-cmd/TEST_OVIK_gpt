name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool libtool-bin \
            pkg-config build-essential cmake ninja-build \
            gettext autopoint \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            python3-dev ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "setuptools<81" \
            wheel \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          python --version
          buildozer --version
          cython --version

      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Install Android SDK
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdline-tools.zip

          rm -rf /tmp/android-commandline
          mkdir -p /tmp/android-commandline

          unzip -q \
            /tmp/cmdline-tools.zip \
            -d /tmp/android-commandline

          mkdir -p \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          cp -R \
            /tmp/android-commandline/cmdline-tools/. \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          echo \
            "$ANDROID_SDK_ROOT/platform-tools" \
            >> "$GITHUB_PATH"

          echo \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0" \
            >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

          echo "ANDROID SDK OK"

      # ---------------------------------------------------------
      # Android NDK r25b
      # ---------------------------------------------------------
      - name: Install Android NDK r25b
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-r25b-linux.zip \
            -O /tmp/android-ndk.zip

          rm -rf "$HOME/android-ndk-r25b"

          unzip -q \
            /tmp/android-ndk.zip \
            -d "$HOME"

          echo \
            "ANDROID_NDK_HOME=$HOME/android-ndk-r25b" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_NDK_ROOT=$HOME/android-ndk-r25b" \
            >> "$GITHUB_ENV"

          test -f \
            "$HOME/android-ndk-r25b/source.properties"

          echo "ANDROID NDK r25b OK"

      # ---------------------------------------------------------
      # IMPORTANT
      #
      # Не создаём symlink python-for-android.
      # Buildozer сам клонирует нужную ветку.
      # ---------------------------------------------------------
      - name: Configure fixed python-for-android
        run: |
          cat >> buildozer.spec <<'EOF'

          # Fixed python-for-android release
          p4a.branch = v2024.01.21
          android.ndk_path = /home/runner/android-ndk-r25b
          android.sdk_path = /home/runner/android-sdk
          EOF

          echo "=============================="
          echo "FINAL BUILDOZER CONFIGURATION"
          echo "=============================="

          cat buildozer.spec

      # ---------------------------------------------------------
      # Clean build
      # ---------------------------------------------------------
      - name: Clean Buildozer directories
        run: |
          rm -rf .buildozer
          rm -rf bin

          # На всякий случай убираем глобальный p4a предыдущих запусков.
          rm -rf "$HOME/.buildozer/android/platform/python-for-android"

          mkdir -p bin

          echo "CLEAN BUILD READY"

      # ---------------------------------------------------------
      # Environment check
      # ---------------------------------------------------------
      - name: Verify build environment
        run: |
          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "Cython:"
          cython --version

          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_NDK_HOME"

          echo "BUILD ENVIRONMENT OK"

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Build APK
        run: |
          set -o pipefail

          echo "=============================="
          echo "START APK BUILD"
          echo "=============================="

          buildozer \
            -v \
            android \
            debug \
            2>&1 | tee build.log

      # ---------------------------------------------------------
      # Diagnostics
      # ---------------------------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Search for APK
        if: always()
        run: |
          echo "=============================="
          echo "APK SEARCH"
          echo "=============================="

          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

      # ---------------------------------------------------------
      # APK verification
      # ---------------------------------------------------------
      - name: Verify APK
        if: success()
        run: |
          APK_COUNT=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "=============================="
          echo "APK SUCCESSFULLY CREATED"
          echo "=============================="

          ls -lh bin/*.apk

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Test_OV-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
