name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool libtool-bin \
            pkg-config build-essential cmake ninja-build \
            gettext autopoint \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            python3-dev ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "setuptools<81" \
            wheel \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          python --version
          java -version
          buildozer --version
          cython --version

      # ----------------------------------------------------------
      # FIX buildozer.spec
      #
      # ВАЖНО:
      # настройки добавляются ВНУТРИ секции [app],
      # а не после [buildozer].
      # ----------------------------------------------------------
      - name: Configure python-for-android
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text(encoding="utf-8")

          # Убираем параметры, если они остались от старых попыток.
          lines = []

          for line in text.splitlines():
              stripped = line.strip()

              if stripped.startswith("p4a.branch"):
                  continue

              if stripped.startswith("android.sdk_path"):
                  continue

              if stripped.startswith("android.ndk_path"):
                  continue

              lines.append(line)

          text = "\n".join(lines) + "\n"

          # Вставляем p4a.branch перед [buildozer],
          # то есть параметр остаётся в [app].
          marker = "[buildozer]"

          if marker not in text:
              raise RuntimeError(
                  "Section [buildozer] not found in buildozer.spec"
              )

          text = text.replace(
              marker,
              "\n"
              "# Fixed python-for-android version\n"
              "p4a.branch = v2024.01.21\n"
              "\n"
              + marker,
              1,
          )

          path.write_text(text, encoding="utf-8")
          PY

          echo "================================"
          echo "FINAL buildozer.spec"
          echo "================================"

          cat buildozer.spec

          echo "================================"
          echo "CHECK P4A"
          echo "================================"

          grep -n "p4a.branch" buildozer.spec

      # ----------------------------------------------------------
      # Buildozer будет использовать этот SDK.
      #
      # Сам SDK он установит сам.
      # Но лицензии создаём заранее именно в ЕГО каталоге.
      # ----------------------------------------------------------
      - name: Prepare Buildozer Android licenses
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_DIR/licenses"

          echo \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > "$SDK_DIR/licenses/android-sdk-license"

          echo \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$SDK_DIR/licenses/android-sdk-license"

          echo \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK_DIR/licenses/android-sdk-preview-license"

          echo "================================"
          echo "BUILDOZER LICENSES"
          echo "================================"

          ls -la "$SDK_DIR/licenses"

          cat "$SDK_DIR/licenses/android-sdk-license"

      # ----------------------------------------------------------
      # Чистим только проектный build.
      # Глобальную папку с лицензиями НЕ удаляем.
      # ----------------------------------------------------------
      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "CLEAN BUILD READY"

      - name: Verify application files
        run: |
          test -f main.py
          test -f testov.kv
          test -f buildozer.spec
          test -f assets/icon.png
          test -d data
          test -d fonts

          echo "APPLICATION FILES OK"

      # ----------------------------------------------------------
      # BUILD
      # ----------------------------------------------------------
      - name: Build APK
        run: |
          set -o pipefail

          echo "================================"
          echo "STARTING APK BUILD"
          echo "================================"

          buildozer -v android debug 2>&1 | tee build.log

      # ----------------------------------------------------------
      # Всегда сохраняем лог
      # ----------------------------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # ----------------------------------------------------------
      # Ищем APK даже после ошибки
      # ----------------------------------------------------------
      - name: Search for APK
        if: always()
        run: |
          echo "================================"
          echo "APK SEARCH"
          echo "================================"

          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

      # ----------------------------------------------------------
      # Проверка результата
      # ----------------------------------------------------------
      - name: Verify APK
        if: success()
        run: |
          APK_COUNT=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "================================"
          echo "APK SUCCESSFULLY CREATED"
          echo "================================"

          ls -lh bin/*.apk

      # ----------------------------------------------------------
      # Готовый APK
      # ----------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Test_OV-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
