name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer \
            cython==0.29.36 \
            setuptools \
            wheel

      # Buildozer при первом запуске создаёт Android SDK.
      # Первый запуск может завершиться ошибкой из-за непринятых лицензий.
      # Поэтому разрешаем ему подготовить SDK, после чего принимаем лицензии.
      - name: Initialize Buildozer Android SDK
        continue-on-error: true
        run: |
          yes | buildozer android debug || true

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          echo "Android SDK directory:"
          echo "$SDK_DIR"

          if [ -x "$SDK_DIR/tools/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/tools/bin/sdkmanager" \
              --sdk_root="$SDK_DIR" \
              --licenses || true

            yes | "$SDK_DIR/tools/bin/sdkmanager" \
              --sdk_root="$SDK_DIR" \
              "platform-tools" || true

            yes | "$SDK_DIR/tools/bin/sdkmanager" \
              --sdk_root="$SDK_DIR" \
              "build-tools;35.0.0" || true
          fi

          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$SDK_DIR" \
              --licenses || true

            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$SDK_DIR" \
              "platform-tools" \
              "build-tools;35.0.0" || true
          fi

      - name: Verify Android SDK
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          echo "=== SDK folders ==="
          ls -la "$SDK_DIR" || true

          echo "=== Build tools ==="
          ls -la "$SDK_DIR/build-tools" || true

          echo "=== AIDL ==="
          find "$SDK_DIR" -type f -name aidl -print || true

      - name: Clean previous application build
        run: |
          rm -rf .buildozer/android/platform/build-*
          rm -rf bin
          mkdir -p bin

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Search for APK
        if: always()
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print || true

      - name: Verify APK
        run: |
          APK=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"
          ls -lh "$APK"

      - name: Rename APK
        run: |
          APK=$(find bin -type f -name "*.apk" | head -n 1)
          cp "$APK" bin/TechProfi-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechProfi-APK
          path: bin/TechProfi-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer/**/*.log
          if-no-files-found: ignore
