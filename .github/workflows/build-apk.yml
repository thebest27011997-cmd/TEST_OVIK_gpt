name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl autoconf automake \
            libtool libtool-bin pkg-config cmake patch \
            build-essential ccache zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          python --version
          java -version
          buildozer --version
          cython --version

      - name: Prepare Buildozer Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd /tmp
          rm -rf android-commandline-tools.zip cmdline-tools

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-commandline-tools.zip

          unzip -q android-commandline-tools.zip

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          cp -R \
            /tmp/cmdline-tools/. \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Create Buildozer compatibility paths
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          ln -sf \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/avdmanager"

          chmod +x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"

      - name: Accept Android SDK licenses
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager
          sdkmanager --version

          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"
          test -d "$ANDROID_SDK_ROOT/licenses"

          echo "ANDROID SDK CHECK PASSED"

      # ============================================================
      # ANDROID NDK r25b
      # ============================================================

      - name: Install Android NDK r25b
        run: |
          echo "======================"
          echo "INSTALL ANDROID NDK r25b"
          echo "======================"

          cd /tmp

          rm -rf \
            android-ndk-r25b \
            android-ndk-r25b-linux.zip

          wget -q \
            https://dl.google.com/android/repository/android-ndk-r25b-linux.zip \
            -O android-ndk-r25b-linux.zip

          unzip -q android-ndk-r25b-linux.zip

          mkdir -p \
            /home/runner/.buildozer/android/platform

          rm -rf "$ANDROIDNDK"

          mv \
            /tmp/android-ndk-r25b \
            "$ANDROIDNDK"

          echo "ANDROIDNDK=$ANDROIDNDK"

          test -f \
            "$ANDROIDNDK/source.properties"

          cat \
            "$ANDROIDNDK/source.properties"

          echo "ANDROID NDK r25b CHECK PASSED"

      - name: Verify application files
        run: |
          test -f main.py
          test -f testov.kv
          test -f buildozer.spec
          test -f assets/icon.png

          test -d data
          test -d fonts

          echo "APPLICATION FILES OK"

      - name: Verify Buildozer configuration
        run: |
          echo "======================"
          echo "BUILDOZER CONFIG"
          echo "======================"

          grep "^android.api" buildozer.spec
          grep "^android.minapi" buildozer.spec
          grep "^requirements" buildozer.spec
          grep "^icon.filename" buildozer.spec

          grep -q "^android.api = 35" buildozer.spec

      - name: Final Android license check
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list_installed

      - name: Build APK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH"

          echo "======================"
          echo "STARTING APK BUILD"
          echo "======================"

          echo "SDK used by Buildozer:"
          echo "$ANDROIDSDK"

          echo "NDK used by Buildozer:"
          echo "$ANDROIDNDK"

          buildozer -v android debug

      - name: Show build result
        if: always()
        run: |
          echo "======================"
          echo "BIN DIRECTORY"
          echo "======================"

          if [ -d "bin" ]; then
            find bin \
              -maxdepth 2 \
              -type f \
              -print
          else
            echo "bin directory does not exist"
          fi

          echo ""
          echo "======================"
          echo "APK SEARCH"
          echo "======================"

          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

      - name: Verify APK
        if: success()
        run: |
          APK_COUNT=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "======================"
          echo "APK CREATED"
          echo "======================"

          ls -lh bin/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Test_OV-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
