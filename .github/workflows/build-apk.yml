name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:

      # ============================================================
      # 1. Получаем проект
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Python
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 4. Linux-зависимости
      # ============================================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            patch \
            build-essential \
            ccache \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev

      # ============================================================
      # 5. Buildozer
      # ============================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          echo "======================"
          echo "VERSIONS"
          echo "======================"

          python --version
          java -version
          buildozer --version
          cython --version

      # ============================================================
      # 6. Создаём ЕДИНСТВЕННЫЙ Android SDK
      #
      # Это именно каталог, который использует Buildozer.
      # ============================================================
      - name: Prepare Buildozer Android SDK
        run: |
          echo "SDK location:"
          echo "$ANDROID_SDK_ROOT"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd /tmp

          rm -rf \
            android-commandline-tools.zip \
            cmdline-tools

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-commandline-tools.zip

          unzip -q android-commandline-tools.zip

          mkdir -p \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          cp -R \
            /tmp/cmdline-tools/. \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          echo \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          echo \
            "$ANDROID_SDK_ROOT/platform-tools" \
            >> "$GITHUB_PATH"

          echo \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0" \
            >> "$GITHUB_PATH"

      # ============================================================
      # 7. Создаём старый путь, который ожидает Buildozer
      # ============================================================
      - name: Create Buildozer compatibility paths
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          ln -sf \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/avdmanager"

          chmod +x \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          chmod +x \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"

      # ============================================================
      # 8. Принимаем лицензии В ТОМ ЖЕ SDK
      # ============================================================
      - name: Accept Android SDK licenses
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          echo "======================"
          echo "LICENSE DIRECTORY"
          echo "======================"

          ls -la \
            "$ANDROID_SDK_ROOT/licenses" \
            || true

      # ============================================================
      # 9. Устанавливаем Android API 35
      # ============================================================
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 10. Проверяем SDK ДО Buildozer
      # ============================================================
      - name: Verify Android SDK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH"

          echo "======================"
          echo "ANDROID ENVIRONMENT"
          echo "======================"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo ""
          echo "sdkmanager:"
          which sdkmanager
          sdkmanager --version

          echo ""
          echo "Platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo ""
          echo "Build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo ""
          echo "AIDL:"
          find \
            "$ANDROID_SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            -print

          echo ""
          echo "Old Buildozer sdkmanager path:"
          ls -la \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          # Критические проверки.
          # Если здесь ошибка — Buildozer даже не запускаем.

          test -x \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          test -x \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

          test -d \
            "$ANDROID_SDK_ROOT/licenses"

          echo ""
          echo "ANDROID SDK CHECK PASSED"

      # ============================================================
      # 11. Проверяем приложение
      # ============================================================
      - name: Verify application files
        run: |
          test -f main.py
          test -f testov.kv
          test -f buildozer.spec
          test -f assets/icon.png

          test -d data
          test -d fonts

          echo "======================"
          echo "APPLICATION FILES OK"
          echo "======================"

      # ============================================================
      # 12. Проверяем buildozer.spec
      # ============================================================
      - name: Verify Buildozer configuration
        run: |
          echo "======================"
          echo "BUILDOZER CONFIG"
          echo "======================"

          grep "^android.api" buildozer.spec
          grep "^android.minapi" buildozer.spec
          grep "^requirements" buildozer.spec
          grep "^icon.filename" buildozer.spec

          grep -q "^android.api = 35" buildozer.spec

      # ============================================================
      # 13. Последняя проверка лицензий
      # ============================================================
      - name: Final Android license check
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          echo "Installed SDK packages:"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list_installed

      # ============================================================
      # 14. Сборка APK
      # ============================================================
      - name: Build APK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH"

          echo "======================"
          echo "STARTING APK BUILD"
          echo "======================"

          echo "SDK used by Buildozer:"
          echo "$ANDROIDSDK"

          buildozer -v android debug

      # ============================================================
      # 15. Диагностика — выполняется даже после ошибки
      # ============================================================
      - name: Show build result
        if: always()
        run: |
          echo "======================"
          echo "BIN DIRECTORY"
          echo "======================"

          if [ -d "bin" ]; then
            find \
              bin \
              -maxdepth 2 \
              -type f \
              -print
          else
            echo "bin directory does not exist"
          fi

          echo ""
          echo "======================"
          echo "APK SEARCH"
          echo "======================"

          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

      # ============================================================
      # 16. Проверяем APK
      # ============================================================
      - name: Verify APK
        if: success()
        run: |
          APK_COUNT=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "======================"
          echo "APK CREATED"
          echo "======================"

          ls -lh bin/*.apk

      # ============================================================
      # 17. Загружаем готовый APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Test_OV-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
