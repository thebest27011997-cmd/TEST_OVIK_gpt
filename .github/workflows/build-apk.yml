name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            build-essential \
            cmake \
            ninja-build \
            gettext \
            autopoint \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            python3-dev \
            ccache


      # ============================================================
      # 5. BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer==1.5.0" \
            "Cython==0.29.36" \
            setuptools \
            wheel

          echo "================================"
          echo "VERSIONS"
          echo "================================"

          python --version
          java -version
          buildozer --version
          cython --version


      # ============================================================
      # 6. VERIFY BUILDOZER SPEC
      # ============================================================

      - name: Verify buildozer.spec
        run: |
          set -euxo pipefail

          test -f buildozer.spec

          echo "================================"
          echo "BUILDOZER SPEC"
          echo "================================"

          cat buildozer.spec

          echo
          echo "================================"
          echo "IMPORTANT PARAMETERS"
          echo "================================"

          grep -E \
            "^(title|package.name|package.domain|version|requirements|android.api|android.minapi|android.archs|p4a.branch)" \
            buildozer.spec || true


      # ============================================================
      # 7. PREPARE ANDROID SDK
      # ============================================================

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_ZIP="$RUNNER_TEMP/commandlinetools.zip"
          CMDLINE_TMP="$RUNNER_TEMP/android-cmdline-tools"

          echo "================================"
          echo "PREPARING ANDROID SDK"
          echo "================================"

          rm -rf "$SDK_DIR"
          rm -rf "$CMDLINE_TMP"

          mkdir -p "$SDK_DIR/cmdline-tools"
          mkdir -p "$CMDLINE_TMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O "$CMDLINE_ZIP"

          unzip -q \
            "$CMDLINE_ZIP" \
            -d "$CMDLINE_TMP"

          mv \
            "$CMDLINE_TMP/cmdline-tools" \
            "$SDK_DIR/cmdline-tools/latest"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          echo "================================"
          echo "CREATE BUILDOZER COMPATIBILITY"
          echo "================================"

          # Buildozer 1.5.0 ищет sdkmanager здесь:
          #
          # android-sdk/tools/bin/sdkmanager
          #
          # Современный Android SDK располагает его здесь:
          #
          # android-sdk/cmdline-tools/latest/bin/sdkmanager
          #
          # Поэтому создаём совместимые ссылки.

          mkdir -p "$SDK_DIR/tools"

          ln -sfn \
            "$SDK_DIR/cmdline-tools/latest/bin" \
            "$SDK_DIR/tools/bin"

          ln -sfn \
            "$SDK_DIR/cmdline-tools/latest/lib" \
            "$SDK_DIR/tools/lib"

          ln -sfn \
            "$SDK_DIR/cmdline-tools/latest/source.properties" \
            "$SDK_DIR/tools/source.properties"

          echo "================================"
          echo "MODERN SDKMANAGER"
          echo "================================"

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --version

          echo "================================"
          echo "BUILDOZER SDKMANAGER"
          echo "================================"

          "$SDK_DIR/tools/bin/sdkmanager" \
            --sdk_root="$SDK_DIR" \
            --version

          test -x "$SDK_DIR/tools/bin/sdkmanager"

          echo "================================"
          echo "ANDROID SDK STRUCTURE"
          echo "================================"

          find "$SDK_DIR" \
            -maxdepth 4 \
            -type f \
            -name sdkmanager \
            -print

          echo "================================"
          echo "SDK PREPARATION COMPLETE"
          echo "================================"


      # ============================================================
      # 8. ACCEPT LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        run: |
          set -euxo pipefail

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          echo "================================"
          echo "ACCEPT ANDROID LICENSES"
          echo "================================"

          set +o pipefail
          yes | \
            "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --licenses \
            >/dev/null
          LICENSE_STATUS=$?
          set -o pipefail

          # yes can receive SIGPIPE after sdkmanager closes stdin.
          # The important check is whether licenses/components work below.
          echo "License command status: $LICENSE_STATUS"

          echo "================================"
          echo "LICENSE STEP COMPLETE"
          echo "================================"


      # ============================================================
      # 9. INSTALL ANDROID COMPONENTS
      # ============================================================

      - name: Install Android SDK components
        run: |
          set -euxo pipefail

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          echo "================================"
          echo "INSTALL ANDROID COMPONENTS"
          echo "================================"

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"

          echo
          echo "================================"
          echo "INSTALLED SDK PACKAGES"
          echo "================================"

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --list_installed


      # ============================================================
      # 10. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        run: |
          set -euxo pipefail

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          echo "================================"
          echo "BUILD TOOLS"
          echo "================================"

          ls -la "$SDK_DIR/build-tools"

          echo
          echo "================================"
          echo "PLATFORMS"
          echo "================================"

          ls -la "$SDK_DIR/platforms"

          echo
          echo "================================"
          echo "AIDL"
          echo "================================"

          find \
            "$SDK_DIR/build-tools" \
            -type f \
            -name aidl \
            -print

          echo
          echo "================================"
          echo "ADB"
          echo "================================"

          ls -la \
            "$SDK_DIR/platform-tools/adb"

          echo
          echo "================================"
          echo "SDKMANAGER"
          echo "================================"

          ls -la \
            "$SDK_DIR/tools/bin/sdkmanager"

          test -x \
            "$SDK_DIR/tools/bin/sdkmanager"

          test -x \
            "$SDK_DIR/platform-tools/adb"

          test -f \
            "$SDK_DIR/platforms/android-35/android.jar"

          if [ ! -x "$SDK_DIR/build-tools/35.0.0/aidl" ] && \
             [ ! -x "$SDK_DIR/build-tools/37.0.0/aidl" ]; then

            echo "ERROR: AIDL NOT FOUND"

            exit 1

          fi

          echo
          echo "================================"
          echo "ANDROID SDK READY"
          echo "================================"


      # ============================================================
      # 11. VERIFY APPLICATION FILES
      # ============================================================

      - name: Verify application files
        run: |
          set -euxo pipefail

          echo "================================"
          echo "VERIFY APPLICATION"
          echo "================================"

          test -f main.py
          test -f testov.kv
          test -f buildozer.spec
          test -d data

          echo
          echo "DAT FILES:"
          echo

          find data \
            -maxdepth 1 \
            -type f \
            -name "*.dat" \
            -print

          DAT_COUNT=$(
            find data \
              -maxdepth 1 \
              -type f \
              -name "*.dat" \
              | wc -l
          )

          echo
          echo "DAT files found: $DAT_COUNT"

          if [ "$DAT_COUNT" -eq 0 ]; then

            echo "ERROR: NO DAT FILES FOUND"

            exit 1

          fi

          echo
          echo "================================"
          echo "APPLICATION FILES OK"
          echo "================================"


      # ============================================================
      # 12. CLEAN PROJECT BUILD
      #
      # Удаляем только локальный build проекта.
      #
      # НЕ удаляем:
      # $HOME/.buildozer
      #
      # потому что там находится подготовленный Android SDK.
      # ============================================================

      - name: Clean previous application build
        run: |
          set -euxo pipefail

          echo "================================"
          echo "CLEAN PROJECT"
          echo "================================"

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Project build directory cleaned."


      # ============================================================
      # 13. BUILD APK
      #
      # ВАЖНО:
      #
      # здесь НЕТ:
      #
      # yes | buildozer
      #
      # Лицензии уже приняты отдельно.
      # ============================================================

      - name: Build APK
        run: |
          set -o pipefail

          echo "================================"
          echo "BUILD APK"
          echo "================================"

          buildozer -v android debug 2>&1 | tee build.log


      # ============================================================
      # 14. BUILD DIAGNOSTICS
      # ============================================================

      - name: Show build diagnostics
        if: failure()
        run: |
          echo "================================"
          echo "LAST 500 BUILD LOG LINES"
          echo "================================"

          tail -500 build.log || true

          echo
          echo "================================"
          echo "ERROR SEARCH"
          echo "================================"

          grep -i -n \
            -E "error:|exception|traceback|failed|failure|not found|no such file|valueerror|sdkmanager|aidl" \
            build.log \
            | tail -200 || true


      # ============================================================
      # 15. UPLOAD BUILD LOG
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # 16. SEARCH APK
      # ============================================================

      - name: Search for APK
        if: success()
        run: |
          set -euxo pipefail

          echo "================================"
          echo "SEARCH APK"
          echo "================================"

          find bin \
            -type f \
            -name "*.apk" \
            -ls

          APK_COUNT=$(
            find bin \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo
          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then

            echo "ERROR: APK NOT FOUND"

            exit 1

          fi


      # ============================================================
      # 17. RENAME APK
      # ============================================================

      - name: Rename APK
        if: success()
        run: |
          set -euxo pipefail

          APK_FILE=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | head -n 1
          )

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK FILE NOT FOUND"

            exit 1

          fi

          NEW_APK="bin/TechProfi_${{ github.run_number }}.apk"

          if [ "$APK_FILE" != "$NEW_APK" ]; then
            mv "$APK_FILE" "$NEW_APK"
          fi

          echo
          echo "================================"
          echo "FINAL APK"
          echo "================================"

          ls -lh "$NEW_APK"


      # ============================================================
      # 18. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TechProfi-${{ github.run_number }}
          path: bin/TechProfi_${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
