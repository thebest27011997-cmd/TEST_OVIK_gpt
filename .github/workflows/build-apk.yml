name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ---------------------------------------------------------
      # Linux dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            build-essential \
            cmake \
            ninja-build \
            gettext \
            autopoint \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            python3-dev

      # ---------------------------------------------------------
      # Python dependencies
      # ---------------------------------------------------------
      - name: Install Buildozer and Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          buildozer --version
          cython --version

      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Install Android SDK command line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline-tools

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"

          mv /tmp/android-cmdline-tools/cmdline-tools/* \
            "$HOME/android-sdk/cmdline-tools/latest/"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # Android SDK packages
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ---------------------------------------------------------
      # Android NDK r25b
      # ---------------------------------------------------------
      - name: Install Android NDK r25b
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-r25b-linux.zip \
            -O /tmp/android-ndk.zip

          unzip -q /tmp/android-ndk.zip -d "$HOME"

          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25b" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r25b" >> "$GITHUB_ENV"

          echo "Installed NDK:"
          ls "$HOME/android-ndk-r25b"

      # ---------------------------------------------------------
      # Fixed python-for-android
      #
      # IMPORTANT:
      # We don't allow Buildozer to download a floating master.
      # ---------------------------------------------------------
      - name: Install fixed python-for-android
        run: |
          rm -rf "$HOME/python-for-android"

          git clone \
            --branch v2024.01.21 \
            --depth 1 \
            https://github.com/kivy/python-for-android.git \
            "$HOME/python-for-android"

          cd "$HOME/python-for-android"

          python -m pip install .

          echo "P4A_DIR=$HOME/python-for-android" >> "$GITHUB_ENV"

          echo "python-for-android commit:"
          git rev-parse HEAD

      # ---------------------------------------------------------
      # Check buildozer.spec
      # ---------------------------------------------------------
      - name: Show Buildozer configuration
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "=========================="

      # ---------------------------------------------------------
      # Clean previous Android build
      # ---------------------------------------------------------
      - name: Clean old build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer/android/platform

          ln -s "$HOME/python-for-android" \
            .buildozer/android/platform/python-for-android

      # ---------------------------------------------------------
      # Diagnostic information
      # ---------------------------------------------------------
      - name: Show environment
        run: |
          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "Cython:"
          cython --version

          echo "SDK:"
          echo "$ANDROID_HOME"

          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          echo "P4A:"
          echo "$P4A_DIR"

          echo "SDK packages:"
          sdkmanager --list_installed

      # ---------------------------------------------------------
      # Build APK
      # ---------------------------------------------------------
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

          BUILDOZER_WARN_ON_ROOT: "0"

        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      # ---------------------------------------------------------
      # Upload log even when build fails
      # ---------------------------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
