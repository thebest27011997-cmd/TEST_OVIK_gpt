name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      # ============================================================
      # 1. Получаем исходники приложения
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Python
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 4. Системные зависимости
      # ============================================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            patch \
            build-essential \
            ccache \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev

      # ============================================================
      # 5. Buildozer + Cython
      # ============================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          echo "Buildozer version:"
          buildozer --version

          echo "Cython version:"
          cython --version

      # ============================================================
      # 6. Android Command Line Tools
      # ============================================================
      - name: Install Android Command Line Tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-commandline-tools.zip

          unzip -q android-commandline-tools.zip

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          cp -R \
            cmdline-tools/. \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # ============================================================
      # 7. Принимаем лицензии Android
      # ============================================================
      - name: Accept Android licenses
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

      # ============================================================
      # 8. Устанавливаем SDK под android.api = 35
      # ============================================================
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 9. Совместимость со старым Buildozer
      #
      # Buildozer может искать:
      # android-sdk/tools/bin/sdkmanager
      #
      # Современный SDK хранит его:
      # cmdline-tools/latest/bin/sdkmanager
      # ============================================================
      - name: Create Buildozer SDK compatibility paths
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          ln -sf \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/avdmanager"

          chmod +x \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"

      # ============================================================
      # 10. Проверяем SDK ДО Buildozer
      # ============================================================
      - name: Verify Android SDK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "sdkmanager:"
          which sdkmanager
          sdkmanager --version

          echo ""
          echo "Android platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo ""
          echo "Build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo ""
          echo "AIDL:"
          find "$ANDROID_SDK_ROOT/build-tools" \
            -type f \
            -name aidl \
            -print

          echo ""
          echo "Compatibility sdkmanager:"
          ls -la "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          test -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          test -f \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

      # ============================================================
      # 11. Проверяем файлы нашего приложения
      # ============================================================
      - name: Verify application files
        run: |
          test -f main.py
          test -f testov.kv
          test -f buildozer.spec
          test -f assets/icon.png

          test -d data
          test -d fonts

          echo "Application files OK"

          echo ""
          echo "Project structure:"
          find . \
            -maxdepth 2 \
            -type f \
            ! -path "./.git/*" \
            ! -path "./.android-sdk/*" \
            -print

      # ============================================================
      # 12. Показываем Buildozer configuration
      # ============================================================
      - name: Check Buildozer configuration
        run: |
          echo "Android API from buildozer.spec:"
          grep "^android.api" buildozer.spec

          echo ""
          echo "Minimum Android API:"
          grep "^android.minapi" buildozer.spec

          echo ""
          echo "Requirements:"
          grep "^requirements" buildozer.spec

      # ============================================================
      # 13. Сборка APK
      # ============================================================
      - name: Build APK
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          buildozer -v android debug

      # ============================================================
      # 14. Диагностика результата
      # Выполнится даже при ошибке
      # ============================================================
      - name: Show build result
        if: always()
        run: |
          echo "=============================="
          echo "BIN DIRECTORY"
          echo "=============================="

          if [ -d "bin" ]; then
            find bin -maxdepth 2 -type f -print
          else
            echo "bin directory does not exist"
          fi

          echo ""
          echo "=============================="
          echo "APK SEARCH"
          echo "=============================="

          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

      # ============================================================
      # 15. Проверяем, что APK действительно создан
      # ============================================================
      - name: Verify APK
        if: success()
        run: |
          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          ls -lh bin/*.apk

      # ============================================================
      # 16. Сохраняем APK в GitHub Actions
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Test_OV-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
