name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            build-essential \
            cmake \
            ninja-build \
            gettext \
            autopoint \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            python3-dev \
            ccache


      # ============================================================
      # 5. BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<81" \
            wheel \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          echo "================================"
          echo "VERSIONS"
          echo "================================"

          python --version
          java -version
          buildozer --version
          cython --version


      # ============================================================
      # 6. CONFIGURE PYTHON-FOR-ANDROID
      # ============================================================

      - name: Configure python-for-android
        run: |
          set -euxo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          text = path.read_text(
              encoding="utf-8"
          )

          new_lines = []

          for line in text.splitlines():

              stripped = line.strip()

              if stripped.startswith("p4a.branch"):
                  continue

              if stripped.startswith("android.sdk_path"):
                  continue

              if stripped.startswith("android.ndk_path"):
                  continue

              new_lines.append(line)

          text = "\n".join(new_lines) + "\n"

          marker = "[buildozer]"

          if marker not in text:
              raise RuntimeError(
                  "Section [buildozer] not found in buildozer.spec"
              )

          text = text.replace(
              marker,
              "\n"
              "# Fixed python-for-android version\n"
              "p4a.branch = v2024.01.21\n"
              "\n"
              + marker,
              1,
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("buildozer.spec updated")
          PY

          echo "================================"
          echo "P4A CONFIGURATION"
          echo "================================"

          grep -n \
            "p4a.branch" \
            buildozer.spec


      # ============================================================
      # 7. PREPARE ANDROID SDK
      # ============================================================

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          ZIP_FILE="$RUNNER_TEMP/android-command-line-tools.zip"
          TEMP_DIR="$RUNNER_TEMP/android-command-line-tools"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          echo "================================"
          echo "PREPARING ANDROID SDK"
          echo "================================"

          rm -rf "$SDK_DIR"
          rm -rf "$TEMP_DIR"

          mkdir -p "$SDK_DIR/cmdline-tools"
          mkdir -p "$SDK_DIR/licenses"
          mkdir -p "$TEMP_DIR"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O "$ZIP_FILE"

          unzip -q \
            "$ZIP_FILE" \
            -d "$TEMP_DIR"

          mv \
            "$TEMP_DIR/cmdline-tools" \
            "$SDK_DIR/cmdline-tools/latest"

          mkdir -p "$SDK_DIR/tools"

          ln -s \
            "$SDK_DIR/cmdline-tools/latest/bin" \
            "$SDK_DIR/tools/bin"

          ln -s \
            "$SDK_DIR/cmdline-tools/latest/lib" \
            "$SDK_DIR/tools/lib"

          ln -s \
            "$SDK_DIR/cmdline-tools/latest/source.properties" \
            "$SDK_DIR/tools/source.properties"

          echo \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > "$SDK_DIR/licenses/android-sdk-license"

          echo \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$SDK_DIR/licenses/android-sdk-license"

          echo \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK_DIR/licenses/android-sdk-preview-license"

          echo "================================"
          echo "SDKMANAGER CHECK"
          echo "================================"

          test -x "$SDKMANAGER"
          test -x "$SDK_DIR/tools/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --version

          yes | \
            "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --licenses \
            >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "================================"
          echo "VERIFY ANDROID PACKAGES"
          echo "================================"

          test -f \
            "$SDK_DIR/platforms/android-35/android.jar"

          test -x \
            "$SDK_DIR/build-tools/35.0.0/aidl"

          test -x \
            "$SDK_DIR/platform-tools/adb"

          test -d \
            "$SDK_DIR/licenses"

          echo "ANDROID SDK CHECK PASSED"


      # ============================================================
      # 8. FULL CLEAN
      # ============================================================

      - name: Full clean previous project build
        run: |
          set -euxo pipefail

          echo "================================"
          echo "FULL CLEAN PROJECT BUILD"
          echo "================================"

          rm -rf .buildozer
          rm -rf bin
          rm -rf patches

          mkdir -p bin
          mkdir -p patches

          test ! -d .buildozer
          test -d bin

          echo "================================"
          echo "PROJECT BUILD CACHE REMOVED"
          echo "================================"


      # ============================================================
      # 9. CREATE UUID PATCH SCRIPT
      # ============================================================

      - name: Prepare Python uuid patch
        run: |
          set -euxo pipefail

          cat > patches/patch_python_uuid.py <<'PY'
          from pathlib import Path

          root = Path(".buildozer")

          if not root.exists():
              print("ERROR: .buildozer directory does not exist")
              raise SystemExit(1)

          candidates = {
              "setup.py",
              "Setup",
              "Setup.local",
              "Makefile",
              "Makefile.pre",
              "Makefile.pre.in",
          }

          changed = 0

          for path in root.rglob("*"):

              if not path.is_file():
                  continue

              if path.name not in candidates:
                  continue

              try:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )
              except Exception:
                  continue

              if "-luuid" not in text:
                  continue

              print("FOUND -luuid:", path)

              new_text = text.replace(
                  "-luuid",
                  "",
              )

              path.write_text(
                  new_text,
                  encoding="utf-8",
              )

              changed += 1

              print("PATCHED:", path)

          print("--------------------------------")
          print("Files patched:", changed)
          print("--------------------------------")
          PY

          echo "UUID patch script created."


      # ============================================================
      # 10. VERIFY APPLICATION FILES
      # ============================================================

      - name: Verify application files
        run: |
          set -euxo pipefail

          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          pwd
          ls -la

          echo "--------------------------------"
          echo "buildozer.spec"
          echo "--------------------------------"

          test -f buildozer.spec

          grep -E \
            "^(title|package.name|package.domain|source.dir|source.include_exts|requirements|android.api|android.minapi|android.archs|p4a.branch)" \
            buildozer.spec || true

          echo "--------------------------------"
          echo "Python files"
          echo "--------------------------------"

          find . \
            -maxdepth 2 \
            -type f \
            -name "*.py" \
            -print

          echo "--------------------------------"
          echo "KV files"
          echo "--------------------------------"

          find . \
            -maxdepth 2 \
            -type f \
            -name "*.kv" \
            -print

          echo "--------------------------------"
          echo "DATA DIRECTORY"
          echo "--------------------------------"

          test -d data

          find data \
            -maxdepth 1 \
            -type f \
            -print

          echo "--------------------------------"
          echo "DAT FILES"
          echo "--------------------------------"

          DAT_COUNT=$(find data -maxdepth 1 -type f -name "*.dat" | wc -l)

          echo "DAT files found: $DAT_COUNT"

          find data \
            -maxdepth 1 \
            -type f \
            -name "*.dat" \
            -print

          if [ "$DAT_COUNT" -eq 0 ]; then
            echo "ERROR: NO .dat FILES FOUND IN data/"
            exit 1
          fi

          echo "--------------------------------"
          echo "QUESTIONS JSON"
          echo "--------------------------------"

          test -f data/questions.json

          ls -lh data/questions.json

          echo "================================"
          echo "APPLICATION FILE CHECK PASSED"
          echo "================================"


      # ============================================================
      # 11. FINAL ANDROID ENVIRONMENT CHECK
      # ============================================================

      - name: Final Android environment check
        run: |
          set -euxo pipefail

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          echo "================================"
          echo "FINAL ANDROID CHECK"
          echo "================================"

          echo "SDK:"
          echo "$SDK_DIR"

          test -d "$SDK_DIR"
          test -x "$SDKMANAGER"
          test -x "$SDK_DIR/tools/bin/sdkmanager"

          test -f \
            "$SDK_DIR/platforms/android-35/android.jar"

          test -x \
            "$SDK_DIR/build-tools/35.0.0/aidl"

          test -x \
            "$SDK_DIR/platform-tools/adb"

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --version

          java -version
          python --version
          buildozer --version

          echo "================================"
          echo "ENVIRONMENT READY"
          echo "================================"


      # ============================================================
      # 12. BUILD APK
      #
      # 1-я попытка создаёт рабочие файлы p4a.
      # Если она падает, проверяем конкретно ошибку -luuid.
      # Затем удаляем -luuid и запускаем Buildozer повторно.
      # ============================================================

      - name: Build APK
        run: |
          set -o pipefail

          echo "================================"
          echo "FIRST BUILD ATTEMPT"
          echo "================================"

          set +e

          buildozer -v android debug \
            2>&1 | tee first-build.log

          FIRST_RESULT=${PIPESTATUS[0]}

          set -e

          echo "================================"
          echo "FIRST BUILD RESULT: $FIRST_RESULT"
          echo "================================"

          # --------------------------------------------------------
          # Если APK уже успешно собран — вторая попытка не нужна
          # --------------------------------------------------------

          if [ "$FIRST_RESULT" -eq 0 ]; then

            echo "FIRST BUILD SUCCESSFUL"

            cp first-build.log build.log

            exit 0

          fi


          # --------------------------------------------------------
          # Проверяем, действительно ли присутствует ошибка -luuid
          # --------------------------------------------------------

          echo "================================"
          echo "CHECKING FOR -luuid ERROR"
          echo "================================"

          if ! grep -q \
            "unable to find library -luuid" \
            first-build.log; then

            echo "ERROR:"
            echo "First build failed, but NOT because of -luuid."
            echo "No automatic patch will be applied."

            cp first-build.log build.log

            exit "$FIRST_RESULT"

          fi


          echo "================================"
          echo "-luuid ERROR CONFIRMED"
          echo "================================"


          # --------------------------------------------------------
          # Показываем все ссылки на -luuid ДО исправления
          # --------------------------------------------------------

          echo "================================"
          echo "UUID REFERENCES BEFORE PATCH"
          echo "================================"

          grep -R -n -- "-luuid" \
            .buildozer/android/platform/build-* \
            2>/dev/null \
            | head -100 || true


          # --------------------------------------------------------
          # Применяем patch
          # --------------------------------------------------------

          echo "================================"
          echo "PATCHING PYTHON UUID"
          echo "================================"

          python patches/patch_python_uuid.py


          # --------------------------------------------------------
          # Дополнительный проход по build-каталогам.
          # Удаляем буквальный -luuid из текстовых build-файлов.
          # --------------------------------------------------------

          echo "================================"
          echo "SECONDARY UUID CLEANUP"
          echo "================================"

          while IFS= read -r -d '' file; do

            if grep -Iq . "$file" 2>/dev/null; then

              if grep -q -- "-luuid" "$file" 2>/dev/null; then

                echo "Cleaning: $file"

                sed -i \
                  's/-luuid//g' \
                  "$file"

              fi

            fi

          done < <(
            find \
              .buildozer/android/platform/build-* \
              -type f \
              -print0 \
              2>/dev/null
          )


          # --------------------------------------------------------
          # Проверяем, осталось ли -luuid
          # --------------------------------------------------------

          echo "================================"
          echo "UUID REFERENCES AFTER PATCH"
          echo "================================"

          grep -R -n -- "-luuid" \
            .buildozer/android/platform/build-* \
            2>/dev/null \
            | head -100 || true


          # --------------------------------------------------------
          # Вторая сборка
          # --------------------------------------------------------

          echo "================================"
          echo "SECOND BUILD ATTEMPT"
          echo "================================"

          buildozer -v android debug \
            2>&1 | tee second-build.log

          SECOND_RESULT=${PIPESTATUS[0]}


          # --------------------------------------------------------
          # Объединяем оба лога
          # --------------------------------------------------------

          {
            echo "================================================"
            echo "FIRST BUILD"
            echo "================================================"

            cat first-build.log

            echo
            echo
            echo "================================================"
            echo "SECOND BUILD AFTER UUID PATCH"
            echo "================================================"

            cat second-build.log

          } > build.log


          echo "================================"
          echo "SECOND BUILD RESULT: $SECOND_RESULT"
          echo "================================"

          exit "$SECOND_RESULT"


      # ============================================================
      # 13. UPLOAD BUILD LOG
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            first-build.log
            second-build.log
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # 14. SEARCH FOR APK
      # ============================================================

      - name: Search for APK
        if: always()
        run: |
          echo "================================"
          echo "SEARCHING FOR APK"
          echo "================================"

          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true


      # ============================================================
      # 15. VERIFY APK
      # ============================================================

      - name: Verify APK
        run: |
          set -euxo pipefail

          echo "================================"
          echo "VERIFY APK"
          echo "================================"

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then

            echo "ERROR: APK WAS NOT CREATED"

            exit 1

          fi

          find bin \
            -type f \
            -name "*.apk" \
            -ls

          echo "================================"
          echo "APK BUILD SUCCESS"
          echo "================================"


      # ============================================================
      # 16. RENAME APK
      # ============================================================

      - name: Rename APK
        run: |
          set -euxo pipefail

          echo "================================"
          echo "RENAMING APK"
          echo "================================"

          APK_FILE=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK FILE NOT FOUND"

            exit 1

          fi

          NEW_APK="bin/TEST_OVIK_${{ github.run_number }}.apk"

          mv \
            "$APK_FILE" \
            "$NEW_APK"

          echo "Original APK:"
          echo "$APK_FILE"

          echo "New APK:"
          echo "$NEW_APK"

          test -f "$NEW_APK"

          echo "================================"
          echo "APK RENAME SUCCESS"
          echo "================================"


      # ============================================================
      # 17. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST_OVIK_${{ github.run_number }}
          path: bin/TEST_OVIK_${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
